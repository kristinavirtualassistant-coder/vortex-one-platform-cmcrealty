                         setPendingAction('');
                         aiResponse = "Action cancelled. How else can I assist you today?";
                    } else if (userMsg.trim() === atob("MzQ5Nw==")) {
                        aiResponse = `✅ Admin Security Authorization (Level 9) verified. Executing root infrastructure protocol: "${pendingAction}". Platform structural modifications have been deployed.`;
                        setAwaitingPin(false);
                        setPendingAction('');
                    } else {
                        aiResponse = "❌ Invalid Admin Authorization. Infrastructure modifications require the valid root Admin PIN. Please try again, or type 'cancel' to abort.";
                    }
                } else {
                    const changeKeywords = ['change', 'update', 'modify', 'delete', 'infrastructure', 'configure', 'rebuild', 'deploy', 'add', 'remove'];
                    const isChangeRequest = changeKeywords.some(kw => userMsg.toLowerCase().includes(kw));

                    if (isChangeRequest) {
                        setAwaitingPin(true);
                        setPendingAction(userMsg);
                        aiResponse = "I can execute that platform modification for you. For security and compliance, please enter your 4-digit Admin PIN to authorize this infrastructure change.";
                    } else {
                        if (userMsg.toLowerCase().includes('lead') || userMsg.toLowerCase().includes('crm')) {
                            aiResponse = "Leads are currently routed through the pipeline based on their equity and distress scores. I recommend enabling the 'High Equity' automated drip campaign to maximize your conversion rate.";
                        } else if (userMsg.toLowerCase().includes('tenant') || userMsg.toLowerCase().includes('rent')) {
                            aiResponse = "Tenant ledgers and maintenance requests are synced in real-time. You can view all outstanding balances, schedule auto-pays, and manage disputes directly in the Financial Hub.";
                        } else if (userMsg.toLowerCase().includes('dialer') || userMsg.toLowerCase().includes('call')) {
                            aiResponse = "The Multi-Agent Dialer is online. It uses background bots to scrub disconnected numbers and drop voicemails, bridging only live human answers to your headset.";
                        } else {
                            aiResponse = "I have analyzed your request. The optimal approach within the Vortex ecosystem is to utilize our automated triggers to streamline this workflow. I can configure that routing for you if you'd like.";
                        }
                    }
                }

                setMessages(prev => [...prev, { role: 'model', text: aiResponse }]);
                setIsLoading(false);
            }, 800);
          };

          return (
            <div className="fixed bottom-6 right-6 z-50">
              {!isOpen ? (
                <button onClick={() => setIsOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition hover:scale-105">
                  <Icons.Brain className="w-7 h-7" />
                </button>
              ) : (
                <div className="bg-white w-96 h-[500px] rounded-3xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-in fade-in">
                   <div className="bg-slate-900 text-white p-4 flex justify-between items-center">
                      <div className="flex items-center gap-2">
                         <div className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                         <h3 className="font-bold text-sm">Vortex AI Assistant</h3>
                      </div>
                      <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-white font-bold">&times;</button>
                   </div>
                   <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
                      {messages.map((m, i) => (
                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                           <div className={`max-w-[85%] p-3 rounded-2xl text-sm font-medium leading-relaxed ${m.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-slate-800 shadow-sm border border-slate-200 rounded-bl-none'}`}>
                              {m.text}
                           </div>
                        </div>
                      ))}
                      {isLoading && (
                         <div className="flex justify-start">
                            <div className="bg-white text-slate-400 p-3 rounded-2xl text-sm border border-slate-200 animate-pulse">Analyzing request...</div>
                         </div>
                      )}
                      <div ref={chatEndRef} />
                   </div>
                   <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                      <input 
                        type={awaitingPin ? "password" : "text"} 
                        value={input} 
                        onChange={(e) => setInput(e.target.value)} 
                        onKeyDown={(e) => e.key === 'Enter' && handleSend()} 
                        placeholder={awaitingPin ? "Enter 4-digit PIN..." : "Ask Vortex AI anything..."} 
                        className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-blue-500" 
                      />
                      <button onClick={handleSend} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">Send</button>
                   </div>
                </div>
              )}
            </div>
          );
        };

        function App() {
          const [view, setView] = useState('landing');
          const [userRole, setUserRole] = useState('management');
          const [activeTab, setActiveTab] = useState('dashboard');

          const menuItems = [
            { id: 'dashboard', label: 'Dashboard', icon: Icons.Home, roles: ['management', 'wholesaler', 'tenant', 'landlord', 'maintenance'] },
            { id: 'search', label: 'Property Search', icon: Icons.Map, roles: ['management', 'wholesaler'] },
            { id: 'crm', label: 'CRM Workspace', icon: Icons.Folder, roles: ['management', 'wholesaler'] },
            { id: 'dialer', label: 'Multi-Agent Dialer', icon: Icons.PhoneCall, roles: ['management', 'wholesaler'] },
            { id: 'live', label: 'Live AI Voice & Vision', icon: Icons.Brain, roles: ['management', 'wholesaler'] },
            { id: 'forms', label: 'Forms & Integrations', icon: Icons.Layers, roles: ['management', 'wholesaler'] },
            { id: 'pipelines', label: 'Pipelines & Templates', icon: Icons.FileText, roles: ['management', 'wholesaler'] },
            { id: 'comms', label: 'Dialer, Calls & SMS', icon: Icons.Settings, roles: ['management', 'wholesaler'] },
            { id: 'insights', label: 'Insights & Analytics', icon: Icons.ChartBar, roles: ['management', 'wholesaler'] },
            { id: 'settings', label: 'Settings', icon: Icons.Settings, roles: ['management', 'wholesaler', 'tenant', 'landlord', 'maintenance'] }
          ];

          if (view === 'landing') return <LandingPage onNavigate={setView} />;
          if (view === 'login') return <LoginPage onLogin={(role) => { setUserRole(role); setActiveTab('dashboard'); setView('app'); }} onBack={() => setView('landing')} />;

          return (
            <div className="flex h-screen overflow-hidden bg-white font-sans text-slate-800">
              <aside className="w-72 bg-slate-900 text-slate-300 flex flex-col shrink-0 z-20">
                <div className="h-16 px-6 text-2xl font-black text-white border-b border-slate-800 flex items-center shrink-0">
                   VORTEX<span className="text-blue-500">ONE</span>
                </div>
                <div className="p-4 border-b border-slate-800 flex items-center gap-3 shrink-0">
                   <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-md"><Icons.Users /></div>
                   <div>
                      <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">{userRole} Portal</p>
                      <p className="text-sm text-white font-bold truncate">Active User</p>
                   </div>
                </div>
                <div className="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                   {menuItems.filter(item => item.roles.includes(userRole)).map(item => {
                     const Icon = item.icon;
                     return (
                       <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center px-4 py-3 rounded-xl font-bold text-sm transition-all ${activeTab === item.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                         <Icon className="w-5 h-5 mr-3" /> {item.label}
                       </button>
                     )
                   })}
                </div>
                <div className="p-4 border-t border-slate-800 shrink-0">
                   <button onClick={() => setView('landing')} className="w-full flex items-center px-4 py-3 rounded-xl font-bold text-sm text-red-400 hover:bg-slate-800 transition"><Icons.LogOut className="w-5 h-5 mr-3" /> Log Out</button>
                </div>
              </aside>
              
              <main className="flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
                 <div className="flex-1 overflow-auto relative">
                    {activeTab === 'dashboard' && <Dashboard userRole={userRole} />}
                    {activeTab === 'search' && <PropertySearchData />}
                    {activeTab === 'crm' && <CRMWorkspace />}
                    {activeTab === 'dialer' && <MultiLineDialer />}
                    {activeTab === 'live' && <LiveAIAssistantTab />}
                    {activeTab === 'forms' && <FormsIntegrations />}
                    {activeTab === 'pipelines' && <PipelinesTemplates />}
                    {activeTab === 'comms' && <DialerCallsSMSConfig />}
                    {activeTab === 'insights' && <CRMInsights />}
                    {activeTab === 'settings' && <CRMSettings />}
                 </div>
              </main>
              <AiAssistant />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
